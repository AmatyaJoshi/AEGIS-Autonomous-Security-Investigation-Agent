# Attack windows for Splunk Boss of the SOC datasets, transcribed from PUBLISHED material only.
#
# Granularity is deliberately coarse (day-level UTC) with a host scope, because the official
# answer material gives dates/hosts/IOCs, not second-precise start/end times. Every window is
# `reviewed: false` until an analyst tightens it in the Labels UI (Phase 4). Nothing here is
# inferred by AEGIS.
#
# refs:
#   [1] Splunk, "Boss of the SOC (BOTS) v1 dataset", https://github.com/splunk/botsv1
#   [2] Splunk .conf2016/2017 BOTS v1 scenario walk-throughs (APT "po1s0n1vy"; Cerber ransomware)
#   [3] Splunk Security Essentials / BOTS v1 question set (imreallynotbatman.com, we8105desk)

