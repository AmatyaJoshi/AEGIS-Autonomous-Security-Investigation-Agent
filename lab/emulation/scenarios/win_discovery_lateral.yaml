id: win_discovery_lateral
title: "Domain reconnaissance and lateral movement"
platform: windows
narrative: >
  With a foothold, the operator enumerates the domain (accounts, groups, trusts, shares, hosts) then
  moves laterally over SMB admin shares and remote service execution, staging data along the way.
  Overlaps deliberately with helpdesk_remote_support and psexec_admin noise so discovery precision is
  tested, not just recall.
gap_seconds: 75
tags: [discovery, lateral-movement]
