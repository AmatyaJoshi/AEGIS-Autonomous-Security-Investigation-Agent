id: win_credential_access
title: "Credential access sweep on a domain-joined host"
platform: windows
narrative: >
  Following code execution, the operator harvests credentials by every common means: LSASS dump via
  a signed binary, SAM/registry copy, shadow-copy of NTDS, browser credential access, SPN
  enumeration for offline cracking, and a targeted brute force. Used to test whether AEGIS can tell
  genuine credential theft from the benign look-alikes in the noise set (dev procdump, backup VSS).
gap_seconds: 90
tags: [credential-access, dc]
