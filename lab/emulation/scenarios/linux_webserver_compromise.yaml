id: linux_webserver_compromise
title: "Linux web server compromise and credential theft"
platform: linux
narrative: >
  A shell command executes on the Ubuntu web server, followed by host and account discovery, access
  to /etc/shadow and SSH private keys, a SetUID privilege-escalation attempt, and internal port
  scanning. Mirrors the auditd/Sysmon-for-Linux telemetry a real DMZ host would emit.
gap_seconds: 75
tags: [linux, credential-access, discovery]
