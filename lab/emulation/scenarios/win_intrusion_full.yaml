id: win_intrusion_full
title: "Phishing to ransomware on a Windows workstation"
platform: windows
narrative: >
  A user opens a malicious document that spawns a command shell (initial access + execution). The
  intruder establishes persistence, escalates via a UAC bypass, dumps credentials, performs local
  discovery, then destroys backups and stops services before impact. Every step is a published
  Atomic Red Team test; nothing here is novel tooling.
gap_seconds: 90
tags: [ransomware, workstation, end-to-end]
