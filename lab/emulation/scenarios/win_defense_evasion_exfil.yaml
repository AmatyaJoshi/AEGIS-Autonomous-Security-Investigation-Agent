id: win_defense_evasion_exfil
title: "Defense evasion, collection and exfiltration"
platform: windows
narrative: >
  The operator hides activity (signed-binary proxy execution, masquerading, registry and file
  hiding, ownership changes), collects and compresses data, then exfiltrates over alternative
  channels. Persistence via WMI event subscription and a service is added for durability.
