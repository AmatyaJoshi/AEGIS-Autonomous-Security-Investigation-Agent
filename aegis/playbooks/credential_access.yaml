# Recommend-only response playbook (SPEC §9.1). NOTHING here is executed by AEGIS. The UI renders
# these as "Analyst action required" steps; a human decides and acts. No step may mutate a system.
id: pb_credential_access
name: Credential Access / Theft
techniques: [T1003, T1003.001, T1003.002, T1003.003, T1003.008, T1552, T1555, T1558, T1110]
applies_when:
  verdict: [true_positive, escalate]
severity_floor: high
recommended_steps:
  - order: 1
    action: "Isolate the affected host from the network"
    owner: analyst
    requires_approval: true
    note: "Containment decision is a human call; AEGIS never isolates hosts (§1.2)."
  - order: 2
    action: "Force-reset credentials for every account observed authenticating from the host in the incident window"
    owner: identity-team
    requires_approval: true
  - order: 3
    action: "Invalidate Kerberos tickets / rotate the krbtgt password if domain credentials were exposed"
    owner: identity-team
    requires_approval: true
  - order: 4
    action: "Hunt for reuse of the dumped credentials across other hosts (lateral movement)"
    owner: analyst
    requires_approval: false
  - order: 5
    action: "Preserve the LSASS/registry/NTDS artefacts named in the evidence for forensics"
    owner: ir-team
    requires_approval: false
references:
  - https://attack.mitre.org/tactics/TA0006/
