name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create venv and install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: ruff check aegis lab bench training tests
      - name: Ruff format check
        run: ruff format --check aegis lab bench training tests
      - name: Mypy (aegis/)
        run: mypy
      - name: Tests
        run: pytest -q --cov=aegis --cov=lab --cov-report=term-missing

  offline-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create venv and install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Scenarios validate against the ART index
        run: python -m aegis.cli lab scenarios
      - name: Generate noise + snapshot + verify (no external services)
        run: |
          python -m aegis.cli lab noise --days 3 --per-day 6
          python -m aegis.cli lab snapshot --name ci --source parquet
          python -m aegis.cli lab verify --name ci
      - name: Attack KB present
        run: test -f aegis/attack/data/techniques.json
