[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — Autonomous SOC investigation agent (recommend-only). Phase 0/1: skeleton, OCSF models, lab data plane."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pytz>=2024.1",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "elasticsearch>=8.13,<9",
    "evtx>=0.8",
    "pysigma>=0.11",
    "pysigma-backend-elasticsearch>=1.1",
    "pysigma-backend-splunk>=1.1",
    "pysigma-pipeline-sysmon>=1.0",
    "pysigma-pipeline-windows>=1.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dateutil>=2.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
    "pandas-stubs",
    "pyarrow-stubs",
]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["aegis", "lab", "bench", "training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegis"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sigma.*", "evtx", "duckdb", "elasticsearch.*", "pyarrow.*"]
ignore_missing_imports = true

# CLAUDE.md: mypy --strict applies to aegis/ only. lab/, bench/ and training/ are data-plane
# scripting checked by tests, not the type gate; imports from them are followed but not reported.
[[tool.mypy.overrides]]
module = ["lab.*", "bench.*", "training.*"]
follow_imports = "silent"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that need network access (skipped in CI)"]
